<!DOCTYPE html>
<html lang="en">
<head>
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    
    html, body {
      margin: 0;
      min-height: 100%;
      height: 100%;
    }

    body {
      background-image: url('https://tr.rbxcdn.com/180DAY-118b4c3a7e1a6b3c2dfea8a6e9ae0ab0/768/432/Image/Webp/noFilter');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
      background-attachment: fixed;
      font-family: Arial, sans-serif;
      color: white;
    }

    .content {
      max-width: 800px;
      margin: 40px auto;
      padding: 30px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 12px;
      line-height: 1.6;
    }

    p {
      margin: 0 0 16px;
    }

    h2, h3 {
      margin-top: 18px;
      margin-bottom: 8px;
      color: white;
    }

    ul {
      margin: 0 0 14px 18px;
      padding-left: 18px;
    }

    ul ul {
      margin-top: 4px;
      margin-bottom: 4px;
    }

    li {
      margin: 4px 0;
      line-height: 1.4;
      color: white;
    }

    li strong {
      color: #ffd166;
    }

    .wiki-section {
      margin-top: 16px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.28);
      overflow: hidden;
    }

    .wiki-section summary {
      list-style: none;
      cursor: pointer;
      padding: 12px 16px;
      font-weight: bold;
      color: #ffd166;
      user-select: none;
    }

    .wiki-section summary::-webkit-details-marker {
      display: none;
    }

    .wiki-section[open] summary {
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .wiki-section .inside {
      padding: 12px 16px 14px;
    }

    .wiki-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-top: 6px;
    }

    .locked-summary {
      cursor: default;
      pointer-events: none;
    }
  </style>
</head>
